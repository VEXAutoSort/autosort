# VEX part table, millimetres, one row per part in its usual resting pose.
#
# label/name are required; every other field is OPTIONAL and a missing field is
# simply not compared. Start from these published dimensions, then tighten them
# with real measurements:  python scripts/preview_classify.py  (press 'r')
#
# fields: length_mm width_mm extent circularity solidity holes

