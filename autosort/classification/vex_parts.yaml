# Standing on end a standoff shows only its hex cross-section, so its length is
# invisible and one row covers every length. This is deliberately identical to the
# low-profile nut below: two labels at the same dimensions collapse the margin, so
# the piece lands in the reject bin to be re-presented instead of being guessed.
- {label: standoff, name: standoff on end, length_mm: 7.33, width_mm: 6.35, holes: 1}

# --- nuts: keps / nylock / plain hex all share 8.73 mm across flats, so one row
#     covers the family. circularity is the only thing separating these from a
#     nylon spacer of the same size -- measure both and tighten it if they collide ---
- {label: nut, name: hex nut 11/32, length_mm: 10.08, width_mm: 8.73, holes: 1}
- {label: nut, name: low-profile hex nut 1/4, length_mm: 7.33, width_mm: 6.35, holes: 1}

# --- spacers: nylon ODs are published; resting on a face you see the full circle ---
- {label: spacer, name: nylon spacer 0.375" OD, length_mm: 9.52, width_mm: 9.52, holes: 1}
- {label: spacer, name: nylon spacer 0.5" OD, length_mm: 12.70, width_mm: 12.70, holes: 1}

