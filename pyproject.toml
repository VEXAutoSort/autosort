[project]
name = "autosort"
version = "0.1.0"
description = "Autonomous VEX-hardware sorter: SO-ARM101 pick -> camera classify -> rotating-arm bin routing."
requires-python = ">=3.12"
dependencies = [
    "lerobot[feetech]",      # SO-ARM101 control + ACT policy inference
    "huggingface_hub[cli]",  # pull the trained ACT pick policy
    "opencv-python",         # camera capture + classical-CV perception/classification
    "numpy",
    "pyyaml",                # config.yaml
    "pyserial",              # rotating-arm (router) controller over serial
]

[project.optional-dependencies]
# the full-machine orchestrator (orchestrator/README.md); pins LeRobot to Henry's version
orchestrator = [
    "lerobot[feetech]==0.5.2",
    "feetech-servo-sdk",     # scservo_sdk: machine bus (bucket / distributor / cup servos)
    "python-kasa>=0.7",      # Kasa HS103 smart plug (shaker)
    "onnxruntime-gpu",       # YOLOv8n-cls ONNX classifier
    "pytest",
]

[project.scripts]
autosort = "autosort.pipeline:main"   # `autosort` behaves like `python run.py`
autosort-orchestrator = "orchestrator.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["autosort", "autosort.classification", "orchestrator"]

[tool.setuptools.package-data]
"autosort.classification" = ["*.yaml"]
"orchestrator" = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
